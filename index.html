<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATELIER VELOX — Haute Architecture & Interior Couture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alabaster: '#FAF8F5',
            pearl: '#F2ECE1',
            charcoal: '#141413',
            obsidian: '#0B0B0A',
            gold: '#C5A880',
            goldLight: '#DFC6A2',
            goldDark: '#9A7B50',
            stone: '#78736A'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --cursor-x: 50vw;
      --cursor-y: 50vh;
    }

    body {
      background-color: #FAF8F5;
      color: #141413;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0B0B0A; }
    ::-webkit-scrollbar-thumb { background: #C5A880; border-radius: 3px; }

    /* Custom Magnetic Cursor */
    @media (pointer: fine) {
      .custom-cursor-dot {
        position: fixed;
        top: 0; left: 0;
        width: 8px; height: 8px;
        background: #C5A880;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: width 0.2s, height 0.2s, background 0.2s;
      }
      .custom-cursor-ring {
        position: fixed;
        top: 0; left: 0;
        width: 38px; height: 38px;
        border: 1px solid rgba(197, 168, 128, 0.55);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: width 0.25s ease-out, height 0.25s ease-out, border-color 0.25s;
      }
    }

    /* X-Ray Blueprint Lens Mask */
    .xray-layer {
      pointer-events: none;
      clip-path: circle(0px at var(--cursor-x) var(--cursor-y));
      transition: clip-path 0.08s ease-out;
    }
    .xray-active .xray-layer {
      clip-path: circle(165px at var(--cursor-x) var(--cursor-y));
    }

    /* Stage Layer Transitions */
    .renovation-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: opacity, transform, filter;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
    }

    /* Lighting Modes on Hero Room */
    .lighting-day { filter: brightness(1.03) contrast(1.02) saturate(1.0); }
    .lighting-golden { filter: brightness(0.96) contrast(1.08) sepia(0.22) saturate(1.25); }
    .lighting-midnight { filter: brightness(0.68) contrast(1.18) hue-rotate(-12deg) saturate(0.9); }

    /* Parallax Banner */
    .parallax-banner {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
    @media (max-width: 768px) {
      .parallax-banner {
        background-attachment: scroll;
      }
    }

    /* Pulse Animation for Floorplan Pins */
    @keyframes pulseGold {
      0% { box-shadow: 0 0 0 0 rgba(197, 168, 128, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(197, 168, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(197, 168, 128, 0); }
    }
    .pin-pulse {
      animation: pulseGold 2s infinite;
    }

    /* Subtle grain overlay */
    .film-grain {
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="selection:bg-gold selection:text-obsidian">

  <!-- Custom Cursor -->
  <div id="cursorDot" class="custom-cursor-dot hidden md:block"></div>
  <div id="cursorRing" class="custom-cursor-ring hidden md:block"></div>

  <!-- ==========================================
       PART 1: 800VH 8-SCROLL ROOM RENOVATION HERO
       ========================================== -->
  <section id="hero-scroll-track" class="relative w-full" style="height: 800vh;">
    <div id="hero-sticky-viewport" class="sticky top-0 left-0 w-full h-screen overflow-hidden bg-obsidian select-none">

      <!-- MASTER ARCHITECTURAL ROOM CONTAINER -->
      <div id="room-canvas" class="relative w-full h-full lighting-day transition-all duration-700">

        <!-- STAGE 01: Raw Architectural Space & Laser Scan (0% - 12.5%) -->
        <div id="stage-1" class="renovation-layer opacity-100">

              <pattern id="brickGrid" width="60" height="30" patternUnits="userSpaceOnUse">

                <line x1="30" y1="0" x2="30" y2="15" stroke="#36332E" stroke-width="1"/>
              </pattern>
              <pattern id="laserGrid" width="80" height="80" patternUnits="userSpaceOnUse">
                <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(197,168,128,0.12)" stroke-width="1"/>
              </pattern>
            </defs>
            <!-- Concrete Shell Background -->
            <rect width="1920" height="1080" fill="url(#rawWall)"/>
            <!-- Back Wall Perspective -->
            <polygon points="320,160 1600,160 1600,780 320,780" fill="url(#brickGrid)" opacity="0.65"/>
            <!-- Left Wall -->
            <polygon points="0,0 320,160 320,780 0,1080" fill="#1B1A18" stroke="#3A3630" stroke-width="1.5"/>
            <!-- Right Window Wall Raw Cutouts -->

            <line x1="200" y1="40" x2="1720" y2="40" stroke="#2D2A26" stroke-width="18"/>
            <line x1="260" y1="95" x2="1660" y2="95" stroke="#252320" stroke-width="14"/>
            <!-- Raw Concrete Slab Floor -->
            <polygon points="320,780 1600,780 1920,1080 0,1080" fill="#23211E"/>
            <!-- CAD Laser Grid Overlay -->
            <rect width="1920" height="1080" fill="url(#laserGrid)"/>
            <!-- Architectural Elevation Markers -->

        </div>

                <line x1="40" y1="0" x2="40" y2="40" stroke="rgba(255,235,205,0.12)" stroke-width="1"/>
              </pattern>
            </defs>
            <!-- Main Floor Polygon -->
            <polygon id="floor-poly" points="320,780 1600,780 1920,1080 0,1080" fill="url(#woodFloor)"/>

        <!-- STAGE 08: Warm Chandelier, Cove LED Illumination & Brand Reveal (87.5% - 100%) -->
        <div id="stage-8" class="renovation-layer opacity-0">
          <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
            <defs>
              <radialGradient id="coveGlow" cx="50%" cy="12%" r="55%">

            <!-- Warm Architectural Cove LED Perimeter Glow -->
            <rect width="1920" height="1080" fill="url(#coveGlow)"/>
            <rect width="1920" height="1080" fill="url(#wallWasher)"/>
            <polygon points="150,22 1770,22 1530,140 390,140" fill="none" stroke="#FFE2B3" stroke-width="5" opacity="0.9"/>
